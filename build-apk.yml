                  import org.json.JSONArray;
                  import org.json.JSONObject;
                  import java.util.ArrayList;
                  @CapacitorPlugin(name = "BaiduMap")
                  public class BaiduMapPlugin extends Plugin {
                      private static final String TAG = "BaiduMapPlugin";
                      private MapView mapView = null;
                      private BaiduMap baiduMap = null;
                       private FrameLayout mapContainer = null;
                       private com.baidu.mapapi.map.Marker workMarker = null;
                      private com.baidu.mapapi.map.Marker posMarker = null;
                      private com.baidu.mapapi.map.Circle fenceCircle = null;
                      @Override
                      public void load() {
                          super.load();
                          try {
                              SDKInitializer.setAgreePrivacy(getContext().getApplicationContext(), true);
                              SDKInitializer.initialize(getContext().getApplicationContext());
                              Log.d(TAG, "Baidu Map SDK initialized");
                          } catch (Exception e) {
                              Log.e(TAG, "Failed to init Baidu Map SDK: " + e.getMessage());
                          }
                      }
                      @Override
                      protected void handleOnDestroy() {
                          super.handleOnDestroy();
                          if (mapView != null) mapView.onDestroy();
                      }
                      @Override protected void handleOnPause() { super.handleOnPause(); if (mapView != null) mapView.onPause(); }
                      @Override protected void handleOnResume() { super.handleOnResume(); if (mapView != null) mapView.onResume(); }
                      @PluginMethod
                      public void initializeMap(PluginCall call) {
                          getActivity().runOnUiThread(() -> {
                              try {
                                  JSObject config = call.getObject("config", new JSObject());
                                  double lat = config.optDouble("lat", 39.9088);
                                  double lng = config.optDouble("lng", 116.3974);
                                  float zoom = (float) config.optDouble("zoom", 18);
                                  Activity activity = getActivity();
                                  ViewGroup rootView = (ViewGroup) activity.getWindow().getDecorView().findViewById(android.R.id.content);
                                  if (mapContainer != null) { rootView.removeView(mapContainer); }
                                  mapContainer = new FrameLayout(activity);
                                  mapContainer.setLayoutParams(new FrameLayout.LayoutParams(
                                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                                  mapView = new MapView(activity);
                                  mapView.setLayoutParams(new FrameLayout.LayoutParams(
                                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                                  mapContainer.addView(mapView);
                                  ViewGroup webViewParent = (ViewGroup) bridge.getWebView().getParent();
                                  webViewParent.addView(mapContainer, 0);
                                  baiduMap = mapView.getMap();
                                  baiduMap.setMyLocationEnabled(false);
                                  LatLng center = new LatLng(lat, lng);
                                  MapStatus mapStatus = new MapStatus.Builder().target(center).zoom(zoom).build();
                                  baiduMap.setMapStatus(MapStatusUpdateFactory.newMapStatus(mapStatus));
                                  baiduMap.getUiSettings().setScrollGesturesEnabled(true);
                                  baiduMap.getUiSettings().setZoomGesturesEnabled(true);
                                  baiduMap.getUiSettings().setRotateGesturesEnabled(false);
                                  baiduMap.setMapType(BaiduMap.MAP_TYPE_NORMAL);
                                  JSObject result = new JSObject();
                                  result.put("success", true);
                                  call.resolve(result);
                              } catch (Exception e) {
                                  Log.e(TAG, "initializeMap error: " + e.getMessage());
                                  call.reject("Map initialization failed: " + e.getMessage());
                              }
                          });
                      }
                      @PluginMethod
                      public void setMapType(PluginCall call) {
                          getActivity().runOnUiThread(() -> {
                              try {
                                  if (baiduMap == null) { call.reject("Map not initialized"); return; }
                                  String type = call.getString("type", "normal");
                                  if ("satellite".equals(type)) baiduMap.setMapType(BaiduMap.MAP_TYPE_SATELLITE);
                                  else if ("3d".equals(type)) { baiduMap.setMapType(BaiduMap.MAP_TYPE_NORMAL); }
                                  else baiduMap.setMapType(BaiduMap.MAP_TYPE_NORMAL);
                                  JSObject result = new JSObject(); result.put("success", true); call.resolve(result);
                              } catch (Exception e) { call.reject("Failed: " + e.getMessage()); }
                          });
                      }
                      @PluginMethod
                      public void setCenter(PluginCall call) {
                          getActivity().runOnUiThread(() -> {
                              try {
                                  if (baiduMap == null) { call.reject("Map not initialized"); return; }
                                  JSObject mapData = call.getData();
                                  double lat = mapData.optDouble("lat", 39.9088);
                                  double lng = mapData.optDouble("lng", 116.3974);
                                  float zoom = mapData.has("zoom") ? (float) mapData.optDouble("zoom", -1) : -1f;
                                  LatLng center = new LatLng(lat, lng);
                                  if (zoom > 0) {
                                      baiduMap.setMapStatus(MapStatusUpdateFactory.newMapStatus(
                                          new MapStatus.Builder().target(center).zoom(zoom).build()));
                                  } else {
                                      baiduMap.setMapStatus(MapStatusUpdateFactory.newLatLng(center));
                                  }
                                  JSObject result = new JSObject(); result.put("success", true); call.resolve(result);
                              } catch (Exception e) { call.reject("Failed: " + e.getMessage()); }
                          });
                      }
                      @PluginMethod
                      public void addWorkMarker(PluginCall call) {
                          getActivity().runOnUiThread(() -> {
                              try {
                                  if (baiduMap == null) { call.reject("Map not initialized"); return; }
                                  double lat = call.getData().optDouble("lat", 39.9088);
                                  double lng = call.getData().optDouble("lng", 116.3974);
                                  String title = call.getString("title", "工作地点");
                                  LatLng position = new LatLng(lat, lng);
                                  if (workMarker != null) workMarker.remove();
                                  BitmapDescriptor icon = BitmapDescriptorFactory.fromResource(android.R.drawable.ic_menu_mylocation);
                                  OverlayOptions markerOptions = new MarkerOptions().position(position).icon(icon).title(title).draggable(false);
                                  workMarker = (com.baidu.mapapi.map.Marker) baiduMap.addOverlay(markerOptions);
                                  JSObject result = new JSObject(); result.put("success", true); call.resolve(result);
                              } catch (Exception e) { call.reject("Failed: " + e.getMessage()); }
                          });
                      }
                      @PluginMethod
                      public void updatePosition(PluginCall call) {
                          getActivity().runOnUiThread(() -> {
                              try {
                                  if (baiduMap == null) { call.reject("Map not initialized"); return; }
                                  double lat = call.getData().optDouble("lat", 39.9088);
                                  double lng = call.getData().optDouble("lng", 116.3974);
                                  LatLng position = new LatLng(lat, lng);
                                  if (posMarker != null) posMarker.remove();
                                  BitmapDescriptor icon = BitmapDescriptorFactory.fromResource(android.R.drawable.ic_menu_compass);
                                  OverlayOptions markerOptions = new MarkerOptions().position(position).icon(icon).title("我的位置").draggable(false);
                                  posMarker = (com.baidu.mapapi.map.Marker) baiduMap.addOverlay(markerOptions);
                                  JSObject result = new JSObject(); result.put("success", true); call.resolve(result);
                              } catch (Exception e) { call.reject("Failed: " + e.getMessage()); }
                          });
                      }
                      @PluginMethod
                      public void drawFence(PluginCall call) {
                          getActivity().runOnUiThread(() -> {
                              try {
                                  if (baiduMap == null) { call.reject("Map not initialized"); return; }
                                  double lat = call.getData().optDouble("lat", 39.9088);
                                  double lng = call.getData().optDouble("lng", 116.3974);
                                  int radius = call.getData().optInt("radius", 200);
                                  LatLng center = new LatLng(lat, lng);
                                  if (fenceCircle != null) fenceCircle.remove();
                                  int color = Color.parseColor("#22c55e");
                                  CircleOptions circleOptions = new CircleOptions().center(center).radius(radius)
                                          .fillColor(Color.argb(15, Color.red(color), Color.green(color), Color.blue(color)))
                                          .stroke(new com.baidu.mapapi.map.Stroke(2, Color.argb(90, Color.red(color), Color.green(color), Color.blue(color))));
                                  fenceCircle = (com.baidu.mapapi.map.Circle) baiduMap.addOverlay(circleOptions);
                                  JSObject result = new JSObject(); result.put("success", true); call.resolve(result);
                              } catch (Exception e) { call.reject("Failed: " + e.getMessage()); }
                          });
                      }
                      @PluginMethod
                      public void toggleTraffic(PluginCall call) {
                          getActivity().runOnUiThread(() -> {
                              try {
                                  if (baiduMap == null) { call.reject("Map not initialized"); return; }
                                  boolean enabled = call.getData().optBoolean("enabled", false);
                                  baiduMap.setTrafficEnabled(enabled);
                                  JSObject result = new JSObject(); result.put("success", true); result.put("enabled", enabled); call.resolve(result);
                              } catch (Exception e) { call.reject("Failed: " + e.getMessage()); }
                          });
                      }
                      @PluginMethod
                      public void setMapVisibility(PluginCall call) {
                          getActivity().runOnUiThread(() -> {
                              try {
                                  if (mapContainer == null) { call.reject("Map not initialized"); return; }
                                  boolean visible = call.getData().optBoolean("visible", true);
                                  mapContainer.setVisibility(visible ? View.VISIBLE : View.GONE);
                                  JSObject result = new JSObject(); result.put("success", true); call.resolve(result);
                              } catch (Exception e) { call.reject("Failed: " + e.getMessage()); }
                           });
                       }
                       @PluginMethod
                       public void destroyMap(PluginCall call) {
                          getActivity().runOnUiThread(() -> {
                              try {
                                  if (mapContainer != null) {
                                      ViewGroup parent = (ViewGroup) mapContainer.getParent();
                                      if (parent != null) parent.removeView(mapContainer);
                                  }
                                  if (mapView != null) { mapView.onDestroy(); mapView = null; }
                                  baiduMap = null; mapContainer = null;
                                  JSObject result = new JSObject(); result.put("success", true); call.resolve(result);
                              } catch (Exception e) { call.reject("Failed: " + e.getMessage()); }
                          });
                      }
                  }
              '''))
          print('Wrote BaiduMapPlugin.java')

          # 8. Register WorkTimePlugin in MainActivity
          main = os.path.join(src, 'MainActivity.java')
          with open(main, 'r') as f:
              content = f.read()
          if 'import com.worktime.tracker.WorkTimePlugin' not in content:
              content = content.replace(
                  'import com.getcapacitor.BridgeActivity;',
                  'import com.getcapacitor.BridgeActivity;\nimport com.worktime.tracker.WorkTimePlugin;'
              )
          if 'registerPlugin(WorkTimePlugin.class)' not in content:
              content = content.replace(
                  'super.onCreate(savedInstanceState);',
                  'super.onCreate(savedInstanceState);\n        registerPlugin(WorkTimePlugin.class);'
              )
          with open(main, 'w') as f:
              f.write(content)
          print("WorkTimePlugin registered in MainActivity")

          # 9. Update AndroidManifest.xml
          manifest = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest) as f:
              m = f.read()

          perms = [
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />',
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />',
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
              '    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />',
              '    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />',
              '    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />',
          ]
          added = []
          for perm in perms:
              name = perm.split('"')[1]
              if name not in m:
                  added.append(perm)
                  print(f'Added {name}')
              else:
                  print(f'{name} already present')
          if added:
              block = '\n'.join(added) + '\n'
              m = re.sub(r'(</manifest>)', block + r'\1', m, count=1)

          services = '''\n          <!-- 前台服务：后台定位与围栏检测 -->\n          <service android:name="com.worktime.tracker.WorkTimeService"\n              android:enabled="true"\n              android:exported="false"\n              android:foregroundServiceType="location" />\n          <!-- VPN 保活服务 -->\n          <service android:name="com.worktime.tracker.DummyVpnService"\n              android:permission="android.permission.BIND_VPN_SERVICE"\n              android:exported="true">\n              <intent-filter>\n                  <action android:name="android.net.VpnService" />\n              </intent-filter>\n          </service>\n          <!-- 开机自启动广播 -->\n          <receiver android:name="com.worktime.tracker.BootReceiver"\n              android:enabled="true"\n              android:exported="true">\n              <intent-filter>\n                  <action android:name="android.intent.action.BOOT_COMPLETED" />\n              </intent-filter>\n          </receiver>\n          <!-- AlarmManager 定时唤醒广播 -->\n          <receiver android:name="com.worktime.tracker.AlarmReceiver"\n              android:enabled="true"\n              android:exported="false" />\n          '''
          if 'WorkTimeService' not in m:
              m = re.sub(r'(</application>)', services + r'\1', m, count=1)
              print('Added services')
          else:
              print('Services already present')

          with open(manifest, 'w') as f:
              f.write(m)
          print("AndroidManifest.xml updated")
          PYEOF

      - name: Add Baidu Map SDK dependencies
        run: |
          # Add Baidu Map SDK to build.gradle
          build_gradle="android/app/build.gradle"
          if [ -f "$build_gradle" ]; then
            # Add mavenCentral if not present
            if ! grep -q "mavenCentral()" "$build_gradle"; then
              sed -i 's/repositories {/repositories {\n        mavenCentral()/' "$build_gradle"
            fi
            # Add Baidu Map dependencies
            if ! grep -q "BaiduMapSDK_Map" "$build_gradle"; then
              sed -i '/dependencies {/a\    implementation '"'"'com.baidu.lbsyun:BaiduMapSDK_Map:7.5.8'"'"'\n    implementation '"'"'com.baidu.lbsyun:BaiduMapSDK_Search:7.5.8'"'"'\n    implementation '"'"'com.baidu.lbsyun:BaiduMapSDK_Util:7.5.8'"'"'\n    implementation '"'"'com.baidu.lbsyun:BaiduMapSDK_Location:9.7.0'"'"'' "$build_gradle"
              echo "Added Baidu Map SDK dependencies"
            else
              echo "Baidu Map SDK dependencies already present"
            fi
          fi

      - name: Register BaiduMapPlugin in MainActivity
        run: |
          python3 - <<'PYEOF'
          import os, re
          src = 'android/app/src/main/java/com/worktime/tracker'
          main = os.path.join(src, 'MainActivity.java')
          if os.path.exists(main):
            with open(main, 'r') as f:
              content = f.read()
            if 'import com.worktime.baidumap.BaiduMapPlugin' not in content:
              content = content.replace(
                'import com.getcapacitor.BridgeActivity;',
                'import com.getcapacitor.BridgeActivity;\nimport com.worktime.baidumap.BaiduMapPlugin;'
              )
            if 'registerPlugin(BaiduMapPlugin.class)' not in content:
              content = content.replace(
                'super.onCreate(savedInstanceState);',
                'super.onCreate(savedInstanceState);\n        registerPlugin(BaiduMapPlugin.class);'
              )
            with open(main, 'w') as f:
              f.write(content)
            print("BaiduMapPlugin registered in MainActivity")
          else:
            print("WARNING: MainActivity.java not found")
          PYEOF

      - name: Sync and build
        env:
          # v107fix: Baidu Map AK from repo secrets when available (fallback keeps old value)
          BAIDU_MAP_AK: ${{ secrets.BAIDU_MAP_AK }}
        run: |
          npx cap sync android
          npx cap copy android
          # Add Baidu Map AK after sync (to avoid being overwritten)
          manifest="android/app/src/main/AndroidManifest.xml"
          if [ -f "$manifest" ]; then
            if ! grep -q "com.baidu.lbsapi.API_KEY" "$manifest"; then
              python3 -c "
          import sys, os
          manifest = sys.argv[1]
          # v107fix: prefer BAIDU_MAP_AK from secrets; hardcoded value only as fallback
          ak = os.environ.get('BAIDU_MAP_AK') or 'iv6XaQG0PkWGA9SPaLtzs9S0pPhPTr7u'
          with open(manifest, 'r') as f:
              content = f.read()
          # Only replace the LAST </application> tag
          parts = content.rsplit('</application>', 1)
          if len(parts) == 2:
              content = parts[0] + '        <meta-data android:name=\"com.baidu.lbsapi.API_KEY\" android:value=\"' + ak + '\" />\n    </application>' + parts[1]
              with open(manifest, 'w') as f:
                  f.write(content)
              print('Added Baidu Map AK to AndroidManifest')
          else:
              print('WARNING: </application> tag not found, cannot add Baidu Map AK')
          " "$manifest"
            else
              echo "Baidu Map AK already present"
            fi
          fi
          # 手动注册 WorkTimePlugin 到 bridge
          cat > /tmp/register_plugin.py <<'PYEOF'
          import json, os
          plugins_file = 'android/app/src/main/assets/capacitor.plugins.json'
          if os.path.exists(plugins_file):
              with open(plugins_file, 'r') as f:
                  data = json.load(f)
              found = False
              for p in data:
                  if p.get('pkg') == 'com.worktime.tracker':
                      found = True
                      break
              if not found:
                  data.append({
                      "pkg": "com.worktime.tracker",
                      "classpath": "com.worktime.tracker.WorkTimePlugin"
                  })
                  with open(plugins_file, 'w') as f:
                      json.dump(data, f, indent=2)
                  print("Added WorkTimePlugin to capacitor.plugins.json")
              else:
                  print("WorkTimePlugin already in capacitor.plugins.json")
          else:
              print("WARNING: capacitor.plugins.json not found")
          bridge_file = 'android/app/src/main/assets/public/capacitor.js'
          if os.path.exists(bridge_file):
              with open(bridge_file, 'r') as f:
                  content = f.read()
              if 'WorkTimePlugin' in content:
                  print("WorkTimePlugin found in bridge JS")
              else:
                  print("WARNING: WorkTimePlugin NOT found in bridge JS, injecting...")
                  plugin_reg = "const WorkTimePlugin = registerPlugin('WorkTimePlugin');"
                  if "const LocalNotifications = registerPlugin('LocalNotifications');" in content:
                      content = content.replace(
                          "const LocalNotifications = registerPlugin('LocalNotifications');",
                          "const LocalNotifications = registerPlugin('LocalNotifications');\n" + plugin_reg
                      )
                      with open(bridge_file, 'w') as f:
                          f.write(content)
                      print("Injected WorkTimePlugin into bridge JS")
          else:
              print("WARNING: bridge JS not found")
          PYEOF
          python3 /tmp/register_plugin.py
          cd android
          ./gradlew assembleDebug

      - name: Package and release
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/*.apk release/worktime-tracker.apk
          ls -la release/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: worktime-tracker-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Create GitHub Release with APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "工时打卡 v${{ github.run_number }}"
          body: |
            🎯 工时定位签到系统 - 自动构建版本
            
            📱 **下载 APK**
            下方 Assets 中点击 `worktime-tracker.apk` 即可下载安装
            
            ⚠️ **安装前请确保：**
            - 开启「允许安装未知来源应用」
            - 首次打开授予定位权限和通知权限
            
            🔧 **功能亮点：**
            - 自动签到/签退（基于 GPS 围栏）
            - 后台持续定位
            - 工时统计与收入计算
            - 打卡通知提醒
          files: release/worktime-tracker.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
