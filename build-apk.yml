name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate project config
        run: |
          # 删除旧配置文件避免冲突
          rm -f capacitor.config.js capacitor.config.ts package.json package-lock.json
          cat > package.json <<'JSONEOF'
          {
            "name": "worktime-tracker",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.1.0",
              "@capacitor/core": "^6.1.0",
              "@capacitor/local-notifications": "^6.1.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.1.0"
            }
          }
          JSONEOF
          cat > capacitor.config.json <<'JSONEOF'
          {
            "appId": "com.worktime.tracker",
            "appName": "工时打卡",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "plugins": {
              "SplashScreen": { "launchShowDuration": 0 }
            }
          }
          JSONEOF

      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/
          cp icon-192.png icon-512.png www/
          if [ -d app-icon ]; then cp -r app-icon www/; fi

      - name: Add Android platform (clean)
        run: |
          rm -rf android
          npx cap add android

      - name: Generate and replace Android app icons
        run: |
          pip install Pillow
          python3 - <<'PYEOF'
          from PIL import Image
          import os
          icon_paths = [
              'app-icon/icon-512.png',
              'icon-512.png',
              'www/app-icon/icon-512.png',
              'www/icon-512.png',
          ]
          src = None
          for p in icon_paths:
              if os.path.exists(p):
                  src = Image.open(p)
                  print('Found icon source at:', p)
                  break
          if src is None:
              print('ERROR: No icon-512.png found. Creating fallback.')
              src = Image.new('RGBA', (512, 512), (0, 200, 200, 255))
          
          sizes = {'mdpi':48, 'hdpi':72, 'xhdpi':96, 'xxhdpi':144, 'xxxhdpi':192}
          for name, size in sizes.items():
            d = f'android/app/src/main/res/mipmap-{name}'
            os.makedirs(d, exist_ok=True)
            img = src.resize((size, size), Image.LANCZOS)
            img.save(f'{d}/ic_launcher.png')
            img.save(f'{d}/ic_launcher_round.png')
            print(f'Generated {d}/ic_launcher.png ({size}x{size})')
          
          anydpi = 'android/app/src/main/res/mipmap-anydpi-v26'
          if os.path.exists(anydpi):
            xml_file = f'{anydpi}/ic_launcher.xml'
            if os.path.exists(xml_file):
                os.remove(xml_file)
                print(f'Removed {xml_file}')
            img = src.resize((108, 108), Image.LANCZOS)
            img.save(f'{anydpi}/ic_launcher_foreground.png')
            print(f'Replaced {anydpi}/ic_launcher_foreground.png')
          PYEOF

      - name: Sync Capacitor project
        run: |
          npx cap sync android
          npx cap copy android

      - name: Inject native services and register plugin
        run: |
          python3 - <<'PYEOF'
          import os, textwrap, re

          pkg = 'com/worktime/tracker'
          src = f'android/app/src/main/java/{pkg}'
          os.makedirs(src, exist_ok=True)

          # 1. NotificationHelper
          with open(os.path.join(src, 'NotificationHelper.java'), 'w') as f:
              f.write(textwrap.dedent('''\
                  package com.worktime.tracker;
                  import android.app.Notification;
                  import android.app.NotificationChannel;
                  import android.app.NotificationManager;
                  import android.content.Context;
                  import android.os.Build;
                  import androidx.core.app.NotificationCompat;
                  public class NotificationHelper {
                      private static final String CID = "worktime_channel";
                      private static final String CNAME = "工时打卡后台服务";
                      public static void createChannel(Context ctx) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                              if (nm != null && nm.getNotificationChannel(CID) == null) {
                                  NotificationChannel ch = new NotificationChannel(CID, CNAME, NotificationManager.IMPORTANCE_LOW);
                                  ch.setDescription("持续定位与围栏检测");
                                  ch.setShowBadge(false);
                                  nm.createNotificationChannel(ch);
                              }
                          }
                      }
                      public static Notification buildForeground(Context ctx, String title, String body) {
                          createChannel(ctx);
                          return new NotificationCompat.Builder(ctx, CID)
                              .setContentTitle(title).setContentText(body)
                              .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                              .setOngoing(true).setPriority(NotificationCompat.PRIORITY_LOW).build();
                      }
                      // v108: 事件通知（自动签到/签退结果）——高优先级渠道 + 点击拉起 App + 真实 notify。
                      // 此前签到通知只 build 从不 notify，用户收不到任何提醒。
                      private static final String CID_EVENT = "worktime_event_channel";
                      public static void notifyEvent(Context ctx, String title, String body) {
                          createChannel(ctx);
                          NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                          if (nm == null) return;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && nm.getNotificationChannel(CID_EVENT) == null) {
                              NotificationChannel ch = new NotificationChannel(CID_EVENT, "打卡事件通知", NotificationManager.IMPORTANCE_HIGH);
                              ch.setDescription("自动签到/签退结果提醒");
                              nm.createNotificationChannel(ch);
                          }
                          android.content.Intent launch = ctx.getPackageManager().getLaunchIntentForPackage(ctx.getPackageName());
                          android.app.PendingIntent pi = null;
                          if (launch != null) {
                              pi = android.app.PendingIntent.getActivity(ctx, 0, launch, android.app.PendingIntent.FLAG_UPDATE_CURRENT | android.app.PendingIntent.FLAG_IMMUTABLE);
                          }
                          NotificationCompat.Builder b = new NotificationCompat.Builder(ctx, CID_EVENT)
                              .setContentTitle(title).setContentText(body)
                              .setSmallIcon(android.R.drawable.ic_dialog_info)
                              .setAutoCancel(true).setPriority(NotificationCompat.PRIORITY_HIGH);
                          if (pi != null) b.setContentIntent(pi);
                          nm.notify(2000 + (int)(System.currentTimeMillis() % 100000), b.build());
                      }
                  }
              '''))

          # 2. LocationHelper
          with open(os.path.join(src, 'LocationHelper.java'), 'w') as f:
              f.write(textwrap.dedent('''\
                  package com.worktime.tracker;
                  import android.Manifest;
                  import android.content.Context;
                  import android.content.pm.PackageManager;
                  import android.location.Location;
                  import android.location.LocationListener;
                  import android.location.LocationManager;
                  import android.os.Bundle;
                  import android.os.Handler;
                  import android.os.Looper;
                  import android.util.Log;
                  import androidx.core.content.ContextCompat;
                  public class LocationHelper {
                      private static final String TAG = "WorkTimeLoc";
                      private LocationManager lm;
                      private LocationListener listener;
                      private Handler handler = new Handler(Looper.getMainLooper());
                      private Runnable timeoutRunnable;
                      private OnLocationCallback callback;
                      public interface OnLocationCallback {
                          void onLocation(double lat, double lng, float accuracy);
                          void onError(String msg);
                      }
                      public LocationHelper(Context ctx) {
                          lm = (LocationManager) ctx.getSystemService(Context.LOCATION_SERVICE);
                      }
                      public void requestOnce(Context ctx, OnLocationCallback cb) {
                          this.callback = cb;
                          if (ContextCompat.checkSelfPermission(ctx, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                              if (cb != null) cb.onError("No location permission"); return;
                          }
                          String provider = LocationManager.GPS_PROVIDER;
                          if (!lm.isProviderEnabled(provider)) provider = LocationManager.NETWORK_PROVIDER;
                          if (!lm.isProviderEnabled(provider)) {
                              if (cb != null) cb.onError("No location provider available"); return;
                          }
                          listener = new LocationListener() {
                              @Override public void onLocationChanged(Location loc) {
                                  if (callback != null) callback.onLocation(loc.getLatitude(), loc.getLongitude(), loc.getAccuracy());
                                  stop();
                              }
                              @Override public void onProviderEnabled(String p) {}
                              @Override public void onProviderDisabled(String p) {}
                              @Override public void onStatusChanged(String p, int s, Bundle e) {}
                          };
                          try { lm.requestLocationUpdates(provider, 0, 0, listener, Looper.getMainLooper()); }
                          catch (Exception e) { Log.e(TAG, "requestLocationUpdates failed", e); if (cb != null) cb.onError(e.getMessage()); return; }
                          timeoutRunnable = () -> { stop(); if (cb != null) cb.onError("Location timeout"); };
                          handler.postDelayed(timeoutRunnable, 15000);
                      }
                      public void stop() {
                          if (timeoutRunnable != null) handler.removeCallbacks(timeoutRunnable);
                          if (listener != null) { try { lm.removeUpdates(listener); } catch (Exception e) {} listener = null; }
                      }
                  }
              '''))

          # 3. GeofenceHelper
          with open(os.path.join(src, 'GeofenceHelper.java'), 'w') as f:
              f.write(textwrap.dedent('''\
                  package com.worktime.tracker;
                  import android.content.Context;
                  import android.content.SharedPreferences;
                  import android.util.Log;
                  public class GeofenceHelper {
                      private static final String TAG = "WorkTimeFence";
                      private static final String PREFS = "worktime_prefs";
                      private static final double R = 6371000;
                      public static boolean isInsideFence(Context ctx, double lat, double lng) {
                          SharedPreferences sp = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                          double wLat = sp.getFloat("work_lat", 0f), wLng = sp.getFloat("work_lng", 0f);
                          int radius = sp.getInt("fence_radius", 200);
                          if (wLat == 0 && wLng == 0) return false;
                          double d = haversine(lat, lng, wLat, wLng);
                          Log.d(TAG, "Distance=" + d + "m, radius=" + radius + "m, inside=" + (d <= radius));
                          return d <= radius;
                      }
                      private static double haversine(double lat1, double lng1, double lat2, double lng2) {
                          double dLat = Math.toRadians(lat2 - lat1), dLng = Math.toRadians(lng2 - lng1);
                          double a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(Math.toRadians(lat1))*Math.cos(Math.toRadians(lat2))*Math.sin(dLng/2)*Math.sin(dLng/2);
                          return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                      }
                  }
              '''))

          # 4. WorkTimeService
          with open(os.path.join(src, 'WorkTimeService.java'), 'w') as f:
              f.write(textwrap.dedent('''\
                  package com.worktime.tracker;
                  import android.app.AlarmManager;
                  import android.app.PendingIntent;
                  import android.app.Service;
                  import android.content.Context;
                  import android.content.Intent;
                  import android.content.SharedPreferences;
                  import android.os.Build;
                  import android.os.Handler;
                   import android.os.IBinder;
                   import android.os.Looper;
                   import android.os.SystemClock;
                   import android.util.Log;
                   import java.util.Calendar;
                   import java.text.SimpleDateFormat;
                   import java.util.Date;
                   import java.util.Locale;
                   import java.util.UUID;
                   import android.content.ContentValues;
                   public class WorkTimeService extends Service {
                       private static final String TAG = "WorkTimeSvc";
                       private static final int NOTIF_ID = 1001;
                       private Handler handler;
                       private Runnable pollRunnable;
                       private LocationHelper locHelper;
                       private int pollIntervalMs = 30000;
                       private android.os.PowerManager.WakeLock wakeLock;
                       @Override public void onCreate() {
                           super.onCreate();
                           handler = new Handler(Looper.getMainLooper());
                           locHelper = new LocationHelper(this);
                           // Acquire a partial wake lock to keep CPU running in Doze mode
                           android.os.PowerManager pm = (android.os.PowerManager) getSystemService(Context.POWER_SERVICE);
                           wakeLock = pm.newWakeLock(android.os.PowerManager.PARTIAL_WAKE_LOCK, "WorkTimeSvc::WakeLock");
                           wakeLock.setReferenceCounted(false);
                           if (!wakeLock.isHeld()) wakeLock.acquire(10*60*1000L); // 10 min max
                           Log.i(TAG, "Service created, wakeLock acquired");
                       }
                      @Override public int onStartCommand(Intent intent, int flags, int startId) {
                          Log.i(TAG, "onStartCommand");
                          SharedPreferences sp = getSharedPreferences("worktime_prefs", MODE_PRIVATE);
                          pollIntervalMs = sp.getInt("poll_interval_ms", 30000);
                          startForeground(NOTIF_ID, NotificationHelper.buildForeground(this, "工时打卡后台运行中", "定位监控与自动签到服务"));
                          startPolling();
                          scheduleAlarm();
                          return START_STICKY;
                      }
                      private void startPolling() {
                          if (pollRunnable != null) handler.removeCallbacks(pollRunnable);
                          pollRunnable = new Runnable() {
                              @Override public void run() {
                                  doCheck();
                                  handler.postDelayed(this, pollIntervalMs);
                              }
                          };
                          handler.post(pollRunnable);
                          Log.i(TAG, "Polling started, interval=" + pollIntervalMs + "ms");
                      }
                        private void doCheck() {
                            // 确保CPU唤醒以执行定位请求
                            if (wakeLock != null && !wakeLock.isHeld()) {
                                wakeLock.acquire(10*60*1000L);
                                Log.i(TAG, "WakeLock reacquired for doCheck");
                            }
                            Log.i(TAG, "doCheck - requesting location");
                            // 检查是否新的一天，如果是则重置签到状态
                           SharedPreferences sp = getSharedPreferences("worktime_prefs", MODE_PRIVATE);
                           long lastCheckDate = sp.getLong("last_check_date", 0);
                           Calendar cal = Calendar.getInstance();
                           cal.set(Calendar.HOUR_OF_DAY, 0);
                           cal.set(Calendar.MINUTE, 0);
                           cal.set(Calendar.SECOND, 0);
                           cal.set(Calendar.MILLISECOND, 0);
                           long todayStart = cal.getTimeInMillis();
                           if (lastCheckDate != todayStart) {
                               SharedPreferences.Editor ed = sp.edit();
                               ed.putBoolean("on_duty", false);
                               ed.putString("last_sign", "");
                               ed.putInt("outside_count", 0); // v108: 同时重置防漂移计数
                               ed.putLong("last_check_date", todayStart);
                               ed.apply();
                               Log.i(TAG, "New day detected, reset duty status");
                           }
                           locHelper.requestOnce(WorkTimeService.this, new LocationHelper.OnLocationCallback() {
                              @Override public void onLocation(double lat, double lng, float acc) {
                                  Log.i(TAG, "Location: " + lat + "," + lng + " acc=" + acc);
                                  boolean inside = GeofenceHelper.isInsideFence(WorkTimeService.this, lat, lng);
                                  SharedPreferences sp = getSharedPreferences("worktime_prefs", MODE_PRIVATE);
                                  boolean onDuty = sp.getBoolean("on_duty", false);
                                  String lastSign = sp.getString("last_sign", "");
                                  long nowMs = System.currentTimeMillis();
                                   boolean autoCheckIn = sp.getBoolean("auto_checkin", true);
                                   // v108: 时间窗改用「当日零点 + 分钟数」每天自算——此前用 JS 传入的
                                   // 绝对时间戳 start_ms，App 隔天未打开时窗口过期失效；且 start_ms=0
                                   // 时条件恒真，半夜进入围栏也会误签。
                                   Calendar c2 = Calendar.getInstance();
                                   c2.set(Calendar.HOUR_OF_DAY, 0);
                                   c2.set(Calendar.MINUTE, 0);
                                   c2.set(Calendar.SECOND, 0);
                                   c2.set(Calendar.MILLISECOND, 0);
                                   long dayStart = c2.getTimeInMillis();
                                   int startMin = sp.getInt("start_min_of_day", 540);  // 默认 09:00
                                   int endMin = sp.getInt("end_min_of_day", 1080);     // 默认 18:00
                                   long startMs = dayStart + startMin * 60000L;
                                   long endMs = dayStart + endMin * 60000L;
                                   long inWinStart = startMs - 3600000L;   // 上班前 1 小时起可签
                                   long inWinEnd = startMs + 4 * 3600000L; // 上班后 4 小时内可签
                                   Log.i(TAG, "Check: inside=" + inside + " onDuty=" + onDuty + " lastSign=" + lastSign
                                       + " inWin=[" + inWinStart + "," + inWinEnd + "] now=" + nowMs + " endMs=" + endMs);
                                   if (autoCheckIn && inside && !onDuty && !"in".equals(lastSign)
                                       && nowMs >= inWinStart && nowMs <= inWinEnd) {
                                       sign("in", nowMs, lat, lng, acc);
                                   } else if (autoCheckIn && !inside && onDuty && "in".equals(lastSign) && nowMs >= endMs) {
                                       // v108: 防 GPS 漂移误签退——连续 2 次定位都在围栏外才确认签退
                                       int oc = sp.getInt("outside_count", 0) + 1;
                                       sp.edit().putInt("outside_count", oc).apply();
                                       Log.i(TAG, "Outside fence after work, count=" + oc);
                                       if (oc >= 2) {
                                           sign("out", nowMs, lat, lng, acc);
                                       }
                                   } else if (inside && sp.getInt("outside_count", 0) != 0) {
                                       sp.edit().putInt("outside_count", 0).apply();
                                   }
                                   // 重新设置下一次闹钟
                                   scheduleAlarm();
                               }
                               @Override public void onError(String msg) { 
                                   Log.w(TAG, "Location error: " + msg);
                                   // 即使定位失败也重新设置闹钟
                                   scheduleAlarm();
                               }
                          });
                      }
                      // v108: 签到落库 + 真实事件通知 + 广播。此前只写 SharedPreferences 并发一条
                      // 无人接收的广播——记录不进 SQLite，App 下次打开看不到任何打卡记录。
                      private void sign(String type, long timeMs, double lat, double lng, float acc) {
                          insertRecordToDb(type, timeMs, lat, lng, acc);
                          SharedPreferences sp = getSharedPreferences("worktime_prefs", MODE_PRIVATE);
                          SharedPreferences.Editor ed = sp.edit();
                          ed.putBoolean("on_duty", "in".equals(type));
                          ed.putString("last_sign", type);
                          ed.putInt("outside_count", 0);
                          ed.apply();
                          Log.i(TAG, "Signed " + type + " at " + timeMs);
                          String timeStr = new SimpleDateFormat("HH:mm", Locale.getDefault()).format(new Date(timeMs));
                          if ("in".equals(type)) {
                              NotificationHelper.notifyEvent(this, "已自动签到上班", "到达工作地点，" + timeStr + " 打卡成功");
                          } else {
                              NotificationHelper.notifyEvent(this, "已自动签退下班", "离开工作地点，" + timeStr + " 打卡成功");
                          }
                          Intent intent = new Intent("com.worktime.tracker.SIGN_EVENT");
                          intent.putExtra("type", type);
                          intent.putExtra("time", timeMs);
                          sendBroadcast(intent);
                      }
                      // v108: 后台签到直接写 SQLite records 表（表结构与 WorkTimePlugin.sqliteSave 一致）。
                      // App 前台可能同时持有写连接，冲突时 busy 重试 3 次。
                      private void insertRecordToDb(String type, long timeMs, double lat, double lng, float acc) {
                          int retries = 3;
                          while (retries-- > 0) {
                              android.database.sqlite.SQLiteDatabase db = null;
                              try {
                                  java.io.File dbFile = new java.io.File(getFilesDir(), "worktime.db");
                                  db = android.database.sqlite.SQLiteDatabase.openOrCreateDatabase(dbFile, null);
                                  db.execSQL("CREATE TABLE IF NOT EXISTS records (id TEXT PRIMARY KEY, type TEXT, time INTEGER, lat REAL, lng REAL, acc REAL, dateKey TEXT, source TEXT)");
                                  ContentValues cv = new ContentValues();
                                  cv.put("id", "native_" + UUID.randomUUID().toString());
                                  cv.put("type", type);
                                  cv.put("time", timeMs);
                                  cv.put("lat", lat);
                                  cv.put("lng", lng);
                                  cv.put("acc", (double) acc);
                                  cv.put("dateKey", new SimpleDateFormat("yyyy-MM-dd", Locale.getDefault()).format(new Date(timeMs)));
                                  cv.put("source", "auto_native");
                                  db.replace("records", null, cv);
                                  Log.i(TAG, "Record saved to SQLite: " + type + " " + timeMs);
                                  return;
                              } catch (Exception e) {
                                  Log.w(TAG, "DB write failed, retries left=" + retries + ": " + e.getMessage());
                                  try { Thread.sleep(300); } catch (InterruptedException ie) {}
                              } finally {
                                  if (db != null) try { db.close(); } catch (Exception e) {}
                              }
                          }
                          Log.e(TAG, "Failed to save record to SQLite after retries");
                      }
                       private void scheduleAlarm() {
                           AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                           Intent intent = new Intent(this, AlarmReceiver.class);
                           PendingIntent pi = PendingIntent.getBroadcast(this, 0, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                           // v108: 闹钟间隔与轮询间隔一致（至少 60s），避免不必要的硬唤醒耗电
                           long interval = Math.max(pollIntervalMs, 60000);
                           long triggerAt = SystemClock.elapsedRealtime() + interval;
                           try {
                               // Use setAlarmClock for better Doze/Standby compatibility
                               // This also shows an alarm icon in status bar
                               AlarmManager.AlarmClockInfo alarmInfo = new AlarmManager.AlarmClockInfo(triggerAt, pi);
                               am.setAlarmClock(alarmInfo, pi);
                               Log.i(TAG, "Alarm scheduled via setAlarmClock, interval=" + interval);
                           } catch (Exception e) {
                               // Fallback for older devices
                               if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                   am.setExactAndAllowWhileIdle(AlarmManager.ELAPSED_REALTIME_WAKEUP, triggerAt, pi);
                               } else {
                                   am.setRepeating(AlarmManager.ELAPSED_REALTIME_WAKEUP, triggerAt, interval, pi);
                               }
                               Log.i(TAG, "Alarm scheduled via fallback");
                           }
                        }
                        @Override public IBinder onBind(Intent intent) { return null; }
                        @Override public void onDestroy() {
                           super.onDestroy();
                           if (pollRunnable != null) handler.removeCallbacks(pollRunnable);
                           locHelper.stop();
                           if (wakeLock != null && wakeLock.isHeld()) {
                               wakeLock.release();
                               Log.i(TAG, "WakeLock released");
                           }
                           Log.i(TAG, "Service destroyed, restarting...");
                           // Android 8+ 必须用 startForegroundService
                           // v108: Android 12+ 后台启动 FGS 受限，直接调用会抛
                           // ForegroundServiceStartNotAllowedException 导致崩溃，加保护；
                           // 服务复活主要靠 AlarmReceiver 定时唤醒兜底。
                           try {
                               if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                   startForegroundService(new Intent(this, WorkTimeService.class));
                               } else {
                                   startService(new Intent(this, WorkTimeService.class));
                               }
                           } catch (Exception e) {
                               Log.w(TAG, "Restart from onDestroy blocked: " + e.getMessage());
                           }
                       }
                  }
              '''))

          # 5. AlarmReceiver
          with open(os.path.join(src, 'AlarmReceiver.java'), 'w') as f:
              f.write(textwrap.dedent('''\
                  package com.worktime.tracker;
                  import android.app.AlarmManager;
                  import android.app.PendingIntent;
                  import android.content.BroadcastReceiver;
                  import android.content.Context;
                  import android.content.Intent;
                  import android.os.Build;
                  import android.os.SystemClock;
                  import android.util.Log;
                   public class AlarmReceiver extends BroadcastReceiver {
                       private static final String TAG = "WorkTimeAlarm";
                       @Override public void onReceive(Context ctx, Intent intent) {
                           Log.i(TAG, "Alarm triggered, restarting service and rescheduling");
                           // 重新设置下一次闹钟
                           AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                           Intent alarmIntent = new Intent(ctx, AlarmReceiver.class);
                           PendingIntent pi = PendingIntent.getBroadcast(ctx, 0, alarmIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                           // v108: 唤醒间隔读取轮询配置（至少 60s），原硬编码 60s 高频硬唤醒耗电
                           android.content.SharedPreferences sp = ctx.getSharedPreferences("worktime_prefs", Context.MODE_PRIVATE);
                           long interval = Math.max(sp.getInt("poll_interval_ms", 300000), 60000);
                           long nextTrigger = SystemClock.elapsedRealtime() + interval;
                           if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                               am.setExactAndAllowWhileIdle(AlarmManager.ELAPSED_REALTIME_WAKEUP, nextTrigger, pi);
                           } else {
                               am.setRepeating(AlarmManager.ELAPSED_REALTIME_WAKEUP, nextTrigger, interval, pi);
                           }
                           Log.i(TAG, "Next alarm scheduled, interval=" + interval);
                           // 启动服务
                           Intent svc = new Intent(ctx, WorkTimeService.class);
                           if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                               ctx.startForegroundService(svc);
                           } else {
                               ctx.startService(svc);
                           }
                       }
                   }
