                  private SQLiteDatabase getSQLiteDB() {
                      if (sqliteDb == null || !sqliteDb.isOpen()) {
                          File dbFile = new File(getContext().getFilesDir(), "worktime.db");
                          sqliteDb = SQLiteDatabase.openOrCreateDatabase(dbFile, null);
                          sqliteDb.execSQL("CREATE TABLE IF NOT EXISTS settings (key TEXT PRIMARY KEY, value TEXT)");
                          sqliteDb.execSQL("CREATE TABLE IF NOT EXISTS records (id TEXT PRIMARY KEY, type TEXT, time INTEGER, lat REAL, lng REAL, acc REAL, dateKey TEXT, source TEXT)");
                      }
                      return sqliteDb;
                  }
                  @PluginMethod
                  public synchronized void sqliteSave(PluginCall call) {
                      JSObject ret = new JSObject();
                      try {
                          SQLiteDatabase db = getSQLiteDB();
                          String settingsJson = call.getString("settings", "{}");
                          // v107fix: wrap the whole rewrite in a transaction. Previously it deleted
                          // the entire records table first and re-inserted row by row WITHOUT a
                          // transaction - a crash mid-write left the primary persistence layer empty.
                          db.beginTransaction();
                          try {
                              ContentValues cv = new ContentValues();
                              cv.put("key", "main");
                              cv.put("value", settingsJson);
                              db.replace("settings", null, cv);
                              db.delete("records", null, null);
                              String recordsStr = call.getString("records", "{\\\"records\\\":[]}");
                              org.json.JSONObject recordsObj = new org.json.JSONObject(recordsStr);
                              org.json.JSONArray arr = recordsObj.getJSONArray("records");
                              if (arr != null) {
                                  for (int i = 0; i < arr.length(); i++) {
                                      org.json.JSONObject rec = arr.getJSONObject(i);
                                      ContentValues rcv = new ContentValues();
                                      rcv.put("id", rec.optString("id", ""));
                                      rcv.put("type", rec.optString("type", ""));
                                      rcv.put("time", rec.optLong("time", 0));
                                      // v107fix: JSON null guard - has() returns true for explicit
                                      // nulls and getDouble() throws JSONException on them.
                                      rcv.put("lat", rec.isNull("lat") ? null : Double.valueOf(rec.optDouble("lat", 0)));
                                      rcv.put("lng", rec.isNull("lng") ? null : Double.valueOf(rec.optDouble("lng", 0)));
                                      rcv.put("acc", rec.isNull("acc") ? null : Double.valueOf(rec.optDouble("acc", 0)));
                                      rcv.put("dateKey", rec.optString("dateKey", ""));
                                      rcv.put("source", rec.optString("source", ""));
                                      db.replace("records", null, rcv);
                                  }
                              }
                              db.setTransactionSuccessful();
                          } finally {
                              db.endTransaction();
                          }
                          ret.put("success", true);
                          call.resolve(ret);
                      } catch (Exception e) {
                          ret.put("success", false);
                          ret.put("error", e.getMessage());
                          call.resolve(ret);
                      }
                  }
                  @PluginMethod
                  public void sqliteLoad(PluginCall call) {
                      JSObject ret = new JSObject();
                      try {
                          SQLiteDatabase db = getSQLiteDB();
                          Cursor c = db.rawQuery("SELECT value FROM settings WHERE key = ?", new String[]{"main"});
                          String settingsJson = "{}";
                          if (c.moveToFirst()) {
                              settingsJson = c.getString(0);
                          }
                          c.close();
                          org.json.JSONObject data = new org.json.JSONObject();
                          data.put("settings", new org.json.JSONObject(settingsJson));
                          Cursor rc = db.rawQuery("SELECT id, type, time, lat, lng, acc, dateKey, source FROM records ORDER BY time", null);
                          org.json.JSONArray recordsArr = new org.json.JSONArray();
                          while (rc.moveToNext()) {
                              org.json.JSONObject rec = new org.json.JSONObject();
                              rec.put("id", rc.getString(0));
                              rec.put("type", rc.getString(1));
                              rec.put("time", rc.getLong(2));
                              rec.put("lat", rc.isNull(3) ? org.json.JSONObject.NULL : rc.getDouble(3));
                              rec.put("lng", rc.isNull(4) ? org.json.JSONObject.NULL : rc.getDouble(4));
                              rec.put("acc", rc.isNull(5) ? org.json.JSONObject.NULL : rc.getDouble(5));
                              rec.put("dateKey", rc.getString(6));
                              rec.put("source", rc.getString(7));
                              recordsArr.put(rec);
                          }
                          rc.close();
                          data.put("records", recordsArr);
                          ret.put("success", true);
                          ret.put("data", data.toString());
                          call.resolve(ret);
                      } catch (Exception e) {
                          ret.put("success", false);
                          ret.put("error", e.getMessage());
                          call.resolve(ret);
                      }
