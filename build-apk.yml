                  package com.worktime.tracker;
                  import android.app.Notification;
                  import android.app.PendingIntent;
                  import android.content.Intent;
                  import android.net.VpnService;
                  import android.os.ParcelFileDescriptor;
                  import android.util.Log;
                  import java.io.FileInputStream;
                  import java.nio.ByteBuffer;
                  public class DummyVpnService extends VpnService {
                      private static final String TAG = "WorkTimeVPN";
                      public static volatile boolean isRunning = false;
                      private ParcelFileDescriptor vpnInterface = null;
                      private Thread guardThread = null;
                      private volatile boolean running = false;
                      @Override public void onCreate() {
                          super.onCreate();
                          Log.i(TAG, "DummyVpnService created");
                      }
                      @Override public int onStartCommand(Intent intent, int flags, int startId) {
                          Log.i(TAG, "onStartCommand");
                          if (!running) startVpn();
                          return START_STICKY;
                      }
                      private void startVpn() {
                          try {
                              android.net.VpnService.Builder builder = new android.net.VpnService.Builder()
                                  .setSession("工时打卡保活")
                                  .setMtu(1280)
                                  .addAddress("10.0.0.2", 32);
                              vpnInterface = builder.establish();
                              if (vpnInterface == null) { Log.e(TAG, "VPN establishment failed"); return; }
                              running = true; isRunning = true;
                              Log.i(TAG, "Dummy VPN established");
                              Notification n = NotificationHelper.buildForeground(this, "工时打卡VPN保活", "正在运行中，防止系统杀后台");
                              startForeground(9999, n);
                              guardThread = new Thread(() -> {
                                  FileInputStream fis = new FileInputStream(vpnInterface.getFileDescriptor());
                                  ByteBuffer buf = ByteBuffer.allocate(1);
                                  while (running) {
                                      try { fis.read(buf.array()); Thread.sleep(30000); }
                                      catch (Exception e) { if (running) Log.w(TAG, "VPN read: " + e.getMessage()); }
                                  }
                              }, "VPN-Guard");
                              guardThread.start();
                          } catch (Exception e) { Log.e(TAG, "startVpn error", e); }
                      }
                      private void stopVpn() {
                          running = false; isRunning = false;
                          if (guardThread != null) { guardThread.interrupt(); guardThread = null; }
                          if (vpnInterface != null) { try { vpnInterface.close(); } catch (Exception e) {} vpnInterface = null; }
                          Log.i(TAG, "Dummy VPN stopped");
                      }
                      @Override public void onDestroy() { super.onDestroy(); stopVpn(); }
                      @Override public void onRevoke() {
                          Log.w(TAG, "VPN revoked");
                          stopVpn();
                          startService(new Intent(this, DummyVpnService.class));
                      }
                  }
              '''))
