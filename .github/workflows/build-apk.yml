name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate project config
        run: |
          # 删除旧配置文件避免冲突
          rm -f capacitor.config.js capacitor.config.ts package.json package-lock.json
          cat > package.json <<'JSONEOF'
          {
            "name": "worktime-tracker",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.1.0",
              "@capacitor/core": "^6.1.0",
              "@capacitor/local-notifications": "^6.1.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.1.0"
            }
          }
          JSONEOF
          cat > capacitor.config.json <<'JSONEOF'
          {
            "appId": "com.worktime.tracker",
            "appName": "工时打卡",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "plugins": {
              "SplashScreen": { "launchShowDuration": 0 }
            }
          }
          JSONEOF

      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/
          cp icon-192.png icon-512.png www/
          if [ -d app-icon ]; then cp -r app-icon www/; fi

      - name: Add Android platform (clean)
        run: |
          rm -rf android
          npx cap add android

      - name: Inject native services and register plugin
        run: |
          python3 - <<'PYEOF'
          import os, textwrap, re

          pkg = 'com/worktime/tracker'
          src = f'android/app/src/main/java/{pkg}'
          os.makedirs(src, exist_ok=True)

          # 1. NotificationHelper
          with open(os.path.join(src, 'NotificationHelper.java'), 'w') as f:
              f.write(textwrap.dedent('''\
                  package com.worktime.tracker;
                  import android.app.Notification;
                  import android.app.NotificationChannel;
                  import android.app.NotificationManager;
                  import android.content.Context;
                  import android.os.Build;
                  import androidx.core.app.NotificationCompat;
                  public class NotificationHelper {
                      private static final String CID = "worktime_channel";
                      private static final String CNAME = "工时打卡后台服务";
                      public static void createChannel(Context ctx) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                              if (nm != null && nm.getNotificationChannel(CID) == null) {
                                  NotificationChannel ch = new NotificationChannel(CID, CNAME, NotificationManager.IMPORTANCE_LOW);
                                  ch.setDescription("持续定位与围栏检测");
                                  ch.setShowBadge(false);
                                  nm.createNotificationChannel(ch);
                              }
                          }
                      }
                      public static Notification buildForeground(Context ctx, String title, String body) {
                          createChannel(ctx);
                          return new NotificationCompat.Builder(ctx, CID)
                              .setContentTitle(title).setContentText(body)
                              .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                              .setOngoing(true).setPriority(NotificationCompat.PRIORITY_LOW).build();
                      }
                  }
              '''))

          # 2. LocationHelper
          with open(os.path.join(src, 'LocationHelper.java'), 'w') as f:
              f.write(textwrap.dedent('''\
                  package com.worktime.tracker;
                  import android.Manifest;
                  import android.content.Context;
                  import android.content.pm.PackageManager;
                  import android.location.Location;
                  import android.location.LocationListener;
                  import android.location.LocationManager;
                  import android.os.Bundle;
                  import android.os.Handler;
                  import android.os.Looper;
                  import android.util.Log;
                  import androidx.core.content.ContextCompat;
                  public class LocationHelper {
                      private static final String TAG = "WorkTimeLoc";
                      private LocationManager lm;
                      private LocationListener listener;
                      private Handler handler = new Handler(Looper.getMainLooper());
                      private Runnable timeoutRunnable;
                      private OnLocationCallback callback;
                      public interface OnLocationCallback {
                          void onLocation(double lat, double lng, float accuracy);
                          void onError(String msg);
                      }
                      public LocationHelper(Context ctx) {
                          lm = (LocationManager) ctx.getSystemService(Context.LOCATION_SERVICE);
                      }
                      public void requestOnce(Context ctx, OnLocationCallback cb) {
                          this.callback = cb;
                          if (ContextCompat.checkSelfPermission(ctx, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                              if (cb != null) cb.onError("No location permission"); return;
                          }
                          String provider = LocationManager.GPS_PROVIDER;
                          if (!lm.isProviderEnabled(provider)) provider = LocationManager.NETWORK_PROVIDER;
                          if (!lm.isProviderEnabled(provider)) {
                              if (cb != null) cb.onError("No location provider available"); return;
                          }
                          listener = new LocationListener() {
                              @Override public void onLocationChanged(Location loc) {
                                  if (callback != null) callback.onLocation(loc.getLatitude(), loc.getLongitude(), loc.getAccuracy());
                                  stop();
                              }
                              @Override public void onProviderEnabled(String p) {}
                              @Override public void onProviderDisabled(String p) {}
                              @Override public void onStatusChanged(String p, int s, Bundle e) {}
                          };
                          try { lm.requestLocationUpdates(provider, 0, 0, listener, Looper.getMainLooper()); }
                          catch (Exception e) { Log.e(TAG, "requestLocationUpdates failed", e); if (cb != null) cb.onError(e.getMessage()); return; }
                          timeoutRunnable = () -> { stop(); if (cb != null) cb.onError("Location timeout"); };
                          handler.postDelayed(timeoutRunnable, 15000);
                      }
                      public void stop() {
                          if (timeoutRunnable != null) handler.removeCallbacks(timeoutRunnable);
                          if (listener != null) { try { lm.removeUpdates(listener); } catch (Exception e) {} listener = null; }
                      }
                  }
              '''))

          # 3. GeofenceHelper
          with open(os.path.join(src, 'GeofenceHelper.java'), 'w') as f:
              f.write(textwrap.dedent('''\
                  package com.worktime.tracker;
                  import android.content.Context;
                  import android.content.SharedPreferences;
                  import android.util.Log;
                  public class GeofenceHelper {
                      private static final String TAG = "WorkTimeFence";
                      private static final String PREFS = "worktime_prefs";
                      private static final double R = 6371000;
                      public static boolean isInsideFence(Context ctx, double lat, double lng) {
                          SharedPreferences sp = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                          double wLat = sp.getFloat("work_lat", 0f), wLng = sp.getFloat("work_lng", 0f);
                          int radius = sp.getInt("fence_radius", 200);
                          if (wLat == 0 && wLng == 0) return false;
                          double d = haversine(lat, lng, wLat, wLng);
                          Log.d(TAG, "Distance=" + d + "m, radius=" + radius + "m, inside=" + (d <= radius));
                          return d <= radius;
                      }
                      private static double haversine(double lat1, double lng1, double lat2, double lng2) {
                          double dLat = Math.toRadians(lat2 - lat1), dLng = Math.toRadians(lng2 - lng1);
                          double a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(Math.toRadians(lat1))*Math.cos(Math.toRadians(lat2))*Math.sin(dLng/2)*Math.sin(dLng/2);
                          return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                      }
                  }
              '''))

          # 4. WorkTimeService
          with open(os.path.join(src, 'WorkTimeService.java'), 'w') as f:
              f.write(textwrap.dedent('''\
                  package com.worktime.tracker;
                  import android.app.AlarmManager;
                  import android.app.PendingIntent;
                  import android.app.Service;
                  import android.content.Context;
                  import android.content.Intent;
                  import android.content.SharedPreferences;
                  import android.os.Build;
                  import android.os.Handler;
                  import android.os.IBinder;
                  import android.os.Looper;
                  import android.os.SystemClock;
                  import android.util.Log;
                  public class WorkTimeService extends Service {
                      private static final String TAG = "WorkTimeSvc";
                      private static final int NOTIF_ID = 1001;
                      private Handler handler;
                      private Runnable pollRunnable;
                      private LocationHelper locHelper;
                      private int pollIntervalMs = 30000;
                      @Override public void onCreate() {
                          super.onCreate();
                          handler = new Handler(Looper.getMainLooper());
                          locHelper = new LocationHelper(this);
                          Log.i(TAG, "Service created");
                      }
                      @Override public int onStartCommand(Intent intent, int flags, int startId) {
                          Log.i(TAG, "onStartCommand");
                          SharedPreferences sp = getSharedPreferences("worktime_prefs", MODE_PRIVATE);
                          pollIntervalMs = sp.getInt("poll_interval_ms", 30000);
                          startForeground(NOTIF_ID, NotificationHelper.buildForeground(this, "工时打卡后台运行中", "定位监控与自动签到服务"));
                          startPolling();
                          scheduleAlarm();
                          return START_STICKY;
                      }
                      private void startPolling() {
                          if (pollRunnable != null) handler.removeCallbacks(pollRunnable);
                          pollRunnable = new Runnable() {
                              @Override public void run() {
                                  doCheck();
                                  handler.postDelayed(this, pollIntervalMs);
                              }
                          };
                          handler.post(pollRunnable);
                          Log.i(TAG, "Polling started, interval=" + pollIntervalMs + "ms");
                      }
                      private void doCheck() {
                          Log.i(TAG, "doCheck - requesting location");
                          locHelper.requestOnce(WorkTimeService.this, new LocationHelper.OnLocationCallback() {
                              @Override public void onLocation(double lat, double lng, float acc) {
                                  Log.i(TAG, "Location: " + lat + "," + lng + " acc=" + acc);
                                  boolean inside = GeofenceHelper.isInsideFence(WorkTimeService.this, lat, lng);
                                  SharedPreferences sp = getSharedPreferences("worktime_prefs", MODE_PRIVATE);
                                  boolean onDuty = sp.getBoolean("on_duty", false);
                                  long startMs = sp.getLong("start_ms", 0);
                                  long nowMs = System.currentTimeMillis();
                                  boolean autoCheckIn = sp.getBoolean("auto_checkin", true);
                                  String lastSign = sp.getString("last_sign", "");
                                  if (autoCheckIn && inside && !onDuty && !"in".equals(lastSign) && nowMs >= startMs) {
                                      sign("in", startMs);
                                      NotificationHelper.buildForeground(WorkTimeService.this, "工时打卡", "已到达工作地点，自动签到上班");
                                  }
                              }
                              @Override public void onError(String msg) { Log.w(TAG, "Location error: " + msg); }
                          });
                      }
                      private void sign(String type, long timeMs) {
                          SharedPreferences sp = getSharedPreferences("worktime_prefs", MODE_PRIVATE);
                          SharedPreferences.Editor ed = sp.edit();
                          ed.putBoolean("on_duty", "in".equals(type));
                          ed.putString("last_sign", type);
                          ed.apply();
                          Log.i(TAG, "Signed " + type + " at " + timeMs);
                          Intent intent = new Intent("com.worktime.tracker.SIGN_EVENT");
                          intent.putExtra("type", type);
                          intent.putExtra("time", timeMs);
                          sendBroadcast(intent);
                      }
                      private void scheduleAlarm() {
                          AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                          Intent intent = new Intent(this, AlarmReceiver.class);
                          PendingIntent pi = PendingIntent.getBroadcast(this, 0, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                          long triggerAt = SystemClock.elapsedRealtime() + 60000;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              am.setExactAndAllowWhileIdle(AlarmManager.ELAPSED_REALTIME_WAKEUP, triggerAt, pi);
                          } else {
                              am.setRepeating(AlarmManager.ELAPSED_REALTIME_WAKEUP, triggerAt, 60000, pi);
                          }
                          Log.i(TAG, "Alarm scheduled");
                      }
                      @Override public IBinder onBind(Intent intent) { return null; }
                      @Override public void onDestroy() {
                          super.onDestroy();
                          if (pollRunnable != null) handler.removeCallbacks(pollRunnable);
                          locHelper.stop();
                          Log.i(TAG, "Service destroyed, restarting...");
                          startService(new Intent(this, WorkTimeService.class));
                      }
                  }
              '''))

          # 5. AlarmReceiver
          with open(os.path.join(src, 'AlarmReceiver.java'), 'w') as f:
              f.write(textwrap.dedent('''\
                  package com.worktime.tracker;
                  import android.content.BroadcastReceiver;
                  import android.content.Context;
                  import android.content.Intent;
                  import android.util.Log;
                  public class AlarmReceiver extends BroadcastReceiver {
                      private static final String TAG = "WorkTimeAlarm";
                      @Override public void onReceive(Context ctx, Intent intent) {
                          Log.i(TAG, "Alarm triggered");
                          Intent svc = new Intent(ctx, WorkTimeService.class);
                          if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                              ctx.startForegroundService(svc);
                          } else {
                              ctx.startService(svc);
                          }
                      }
                  }
              '''))

          # 6. BootReceiver
          with open(os.path.join(src, 'BootReceiver.java'), 'w') as f:
              f.write(textwrap.dedent('''\
                  package com.worktime.tracker;
                  import android.content.BroadcastReceiver;
                  import android.content.Context;
                  import android.content.Intent;
                  import android.util.Log;
                  public class BootReceiver extends BroadcastReceiver {
                      private static final String TAG = "WorkTimeBoot";
                      @Override public void onReceive(Context ctx, Intent intent) {
                          if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) {
                              Log.i(TAG, "Boot completed, starting service");
                              Intent svc = new Intent(ctx, WorkTimeService.class);
                              if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                                  ctx.startForegroundService(svc);
                              } else {
                                  ctx.startService(svc);
                              }
                          }
                      }
                  }
              '''))

          # 7. WorkTimePlugin
          with open(os.path.join(src, 'WorkTimePlugin.java'), 'w') as f:
              f.write(textwrap.dedent('''\
                  package com.worktime.tracker;
                  import android.content.Intent;
                  import android.content.SharedPreferences;
                  import com.getcapacitor.JSObject;
                  import com.getcapacitor.Plugin;
                  import com.getcapacitor.PluginCall;
                  import com.getcapacitor.PluginMethod;
                  import com.getcapacitor.annotation.CapacitorPlugin;
                  @CapacitorPlugin(name = "WorkTimePlugin")
                  public class WorkTimePlugin extends Plugin {
                      @PluginMethod
                      public void startService(PluginCall call) {
                          Intent intent = new Intent(getContext(), WorkTimeService.class);
                          if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                              getContext().startForegroundService(intent);
                          } else {
                              getContext().startService(intent);
                          }
                          call.resolve();
                      }
                      @PluginMethod
                      public void stopService(PluginCall call) {
                          getContext().stopService(new Intent(getContext(), WorkTimeService.class));
                          call.resolve();
                      }
                      @PluginMethod
                      public void syncSettings(PluginCall call) {
                          JSObject data = call.getData();
                          SharedPreferences sp = getContext().getSharedPreferences("worktime_prefs", getContext().MODE_PRIVATE);
                          SharedPreferences.Editor ed = sp.edit();
                          if (data.has("workLat")) ed.putFloat("work_lat", (float) data.optDouble("workLat", 0));
                          if (data.has("workLng")) ed.putFloat("work_lng", (float) data.optDouble("workLng", 0));
                          if (data.has("fenceRadius")) ed.putInt("fence_radius", data.optInt("fenceRadius", 200));
                          if (data.has("startMs")) ed.putLong("start_ms", data.optLong("startMs", 0));
                          if (data.has("endMs")) ed.putLong("end_ms", data.optLong("endMs", 0));
                          if (data.has("autoCheckIn")) ed.putBoolean("auto_checkin", data.optBoolean("autoCheckIn", true));
                          if (data.has("pollInterval")) ed.putInt("poll_interval_ms", data.optInt("pollInterval", 30000));
                          ed.apply();
                          call.resolve();
                      }
                  }
              '''))

          # 8. Register WorkTimePlugin in MainActivity
          main = os.path.join(src, 'MainActivity.java')
          with open(main, 'r') as f:
              content = f.read()
          if 'import com.worktime.tracker.WorkTimePlugin' not in content:
              content = content.replace(
                  'import com.getcapacitor.BridgeActivity;',
                  'import com.getcapacitor.BridgeActivity;\nimport com.worktime.tracker.WorkTimePlugin;'
              )
          if 'registerPlugin(WorkTimePlugin.class)' not in content:
              content = content.replace(
                  'super.onCreate(savedInstanceState);',
                  'super.onCreate(savedInstanceState);\n        registerPlugin(WorkTimePlugin.class);'
              )
          with open(main, 'w') as f:
              f.write(content)
          print("WorkTimePlugin registered in MainActivity")

          # 9. Update AndroidManifest.xml
          manifest = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest) as f:
              m = f.read()

          perms = [
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />',
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />',
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
              '    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />',
              '    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />',
          ]
          added = []
          for perm in perms:
              name = perm.split('"')[1]
              if name not in m:
                  added.append(perm)
                  print(f'Added {name}')
              else:
                  print(f'{name} already present')
          if added:
              block = '\n'.join(added) + '\n'
              m = re.sub(r'(</manifest>)', block + r'\1', m, count=1)

          services = '''\n          <!-- 前台服务：后台定位与围栏检测 -->\n          <service android:name="com.worktime.tracker.WorkTimeService"\n              android:enabled="true"\n              android:exported="false"\n              android:foregroundServiceType="location" />\n          <!-- 开机自启动广播 -->\n          <receiver android:name="com.worktime.tracker.BootReceiver"\n              android:enabled="true"\n              android:exported="true">\n              <intent-filter>\n                  <action android:name="android.intent.action.BOOT_COMPLETED" />\n              </intent-filter>\n          </receiver>\n          <!-- AlarmManager 定时唤醒广播 -->\n          <receiver android:name="com.worktime.tracker.AlarmReceiver"\n              android:enabled="true"\n              android:exported="false" />\n          '''
          if 'WorkTimeService' not in m:
              m = re.sub(r'(</application>)', services + r'\1', m, count=1)
              print('Added services')
          else:
              print('Services already present')

          with open(manifest, 'w') as f:
              f.write(m)
          print("AndroidManifest.xml updated")
          PYEOF

      - name: Sync and build
        run: |
          npx cap sync android
          npx cap copy android
          cd android
          ./gradlew assembleDebug

      - name: Package and release
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/*.apk release/worktime-tracker.apk
          ls -la release/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: worktime-tracker-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Create GitHub Release with APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "工时打卡 v${{ github.run_number }}"
          body: |
            🎯 工时定位签到系统 - 自动构建版本
            
            📱 **下载 APK**
            下方 Assets 中点击 `worktime-tracker.apk` 即可下载安装
            
            ⚠️ **安装前请确保：**
            - 开启「允许安装未知来源应用」
            - 首次打开授予定位权限和通知权限
            
            🔧 **功能亮点：**
            - 自动签到/签退（基于 GPS 围栏）
            - 后台持续定位
            - 工时统计与收入计算
            - 打卡通知提醒
          files: release/worktime-tracker.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
