name: Build Android APK/AAB (Release Signed)

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_format:
        description: 'Build format'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools/
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-33" "build-tools;33.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      # ============================================================
      # 签名密钥配置（从 GitHub Secrets 读取，不要在代码里写密码）
      # ============================================================
      - name: Setup signing keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp -f index.html manifest.json sw.js www/
          cp -f icon-192.png icon-512.png www/
          if [ -d app-icon ]; then cp -r app-icon www/; fi

      - name: Init Bubblewrap project
        run: |
          if [ ! -f "twa-manifest.json" ]; then
            bubblewrap init --manifest https://silly-trifle-83536.netlify.app/manifest.json --directory . --force
          fi
        env:
          CI: true

      # ============================================================
      # APK 构建流程（默认）
      # ============================================================
      - name: Build Release APK
        if: github.event.inputs.build_format != 'aab'
        run: |
          bubblewrap build --skipPwaValidation --signingConfig=release
        env:
          CI: true

      - name: Sign APK with release keystore
        if: github.event.inputs.build_format != 'aab'
        run: |
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED_APK="worktime-release.apk"
          
          # Step 1: 先 zipalign 对齐（必须在签名之前！）
          zipalign -p -f -v 4 $UNSIGNED_APK $ALIGNED_APK
          
          # Step 2: 用 apksigner 签名（V1+V2 双签名）
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BUILD_TOOLS/apksigner sign \
            --ks keystore.jks \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --out $SIGNED_APK \
            $ALIGNED_APK
          
          # Step 3: 验证签名真的写入了（失败直接报错）
          $BUILD_TOOLS/apksigner verify -v $SIGNED_APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Upload Release APK
        if: github.event.inputs.build_format != 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: worktime-release-apk
          path: worktime-release.apk
          if-no-files-found: error

      # ============================================================
      # AAB 构建流程（Google Play 上架推荐格式）
      # ============================================================
      - name: Build Release AAB (Android App Bundle)
        if: github.event.inputs.build_format == 'aab'
        run: |
          # Bubblewrap 默认构建 APK，需要手动修改 gradle 构建 AAB
          # 或者使用 Gradle 直接构建 AAB
          cd android-project || cd .
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=../keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            || true
          
          # 如果 gradle 构建失败，回退到 APK 并转换
          if [ ! -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "AAB build failed, falling back to APK conversion..."
            bubblewrap build --skipPwaValidation
            # 使用 bundletool 将 APK 转换为 AAB（需要单独安装）
          fi
        env:
          CI: true
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Upload Release AAB
        if: github.event.inputs.build_format == 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: worktime-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload unsigned fallback
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worktime-unsigned-fallback
          path: app/build/outputs/**/*.*
          if-no-files-found: warn

# ============================================================
# GitHub Secrets 配置说明
# ============================================================
# 在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中添加：
#
# 1. SIGNING_KEYSTORE_BASE64: keystore.jks 文件的 base64 编码
#    生成命令: base64 -w 0 signing/keystore.jks
#
# 2. KEYSTORE_PASSWORD: keystore 的 store 密码
#    当前值: worktime2026
#
# 3. KEY_PASSWORD: 密钥的 key 密码
#    当前值: worktime2026
#
# 4. KEY_ALIAS: 密钥别名
#    当前值: worktime-release
#
# ============================================================
# 使用说明：
# 1. 构建 APK（默认）：直接 push 代码或手动触发 workflow_dispatch
# 2. 构建 AAB（Google Play 上架）：手动触发 workflow_dispatch，选择 build_format = aab
#
# Google Play 要求：
# - 上架必须使用 AAB 格式（从 2021 年 8 月起强制要求）
# - AAB 体积更小，Google Play 会根据设备自动分发适配版本
# - 如需同时测试 APK，可分别触发两次构建
# ============================================================
